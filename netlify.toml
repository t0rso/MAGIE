[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# L'area demo non deve finire nei motori di ricerca
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
